[package]
name = "nyx-pulse"
version = "0.1.0"
description = "Native Telegram desktop client for Omarchy Linux and the Nyx Suite"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-pulse"
path = "src/main.rs"

[dependencies]
nyx-playback = { git = "https://github.com/design-nexus/nyx-design.git", rev = "6b2550bf06ea0d8c8c7e52cff03d4236d46d9777" }
flate2 = "1"
base64 = "0.22"
libloading = "0.8"
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "918729504918ec344b3a853a5ce0ea2c9dbb7b5f" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "6b2550bf06ea0d8c8c7e52cff03d4236d46d9777" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "6b2550bf06ea0d8c8c7e52cff03d4236d46d9777" }
nyx-telegram-core = { path = "../../crates/nyx-telegram-core" }
nyx-telegram-calls = { path = "../../crates/nyx-telegram-calls" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-channel = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
